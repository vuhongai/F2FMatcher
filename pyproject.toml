[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f2fmatcher"
version = "1.0.0"
description = "Fiber-to-fiber matching across histological stains using VAE embeddings, pairwise classifiers, and geometry-aware matching."
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.23",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pillow>=10.0",
    "tqdm>=4.65",
    "joblib>=1.4",
    "pyyaml>=6.0",
    "czifile>=2019.7.2",
    "opencv-python-headless>=4.8",
    "cellpose>=2.2.2",
    "imageio>=2.35",
]

[project.scripts]
f2fmatcher = "f2fmatcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["f2fmatcher*"]

[tool.setuptools.package-data]
f2fmatcher = ["py.typed"]
